# Project-wide Gradle settings.
# Universal settings (daemon, build cache, parallel, vfs.watch, JVM/Kotlin daemons)
# live in ~/.gradle/gradle.properties. Keep only project/Android-specific flags here.

# Configuration cache: avoids reconfiguring the project on each invocation (main gain in CI).
org.gradle.configuration-cache=true
# Tolerate plugins not yet compatible without breaking the build: see the warning then tighten.
org.gradle.configuration-cache.problems=warn

# AndroidX package structure so each library's R class contains only its own resources,
# reducing the R class size for that library.
android.useAndroidX=true
# Kotlin code style: "official" or "obsolete".
kotlin.code.style=official
# Namespace each library's R class so it only includes its own resources.
android.nonTransitiveRClass=true
