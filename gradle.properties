# Project-wide Gradle settings.
# Local-only conveniences (daemon, build cache, parallel, vfs.watch) may also live in
# ~/.gradle/gradle.properties, but the memory flags below must stay in-repo for CI.

# JVM args for the Gradle daemon. Required in-repo: Android Lint analysis runs out of
# metaspace with the default 384 MiB on CI runners (lintAnalyzeDebug -> "Metaspace").
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# Configuration cache: avoids reconfiguring the project on each invocation (main gain in CI).
org.gradle.configuration-cache=true
# Tolerate plugins not yet compatible without breaking the build: see the warning then tighten.
org.gradle.configuration-cache.problems=warn

# Use AndroidX dependencies.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
